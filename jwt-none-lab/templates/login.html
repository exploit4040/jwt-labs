<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Espace Client</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4f6fb;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1a1f36;
  }
  .container {
    background: #fff;
    width: 100%;
    max-width: 400px;
    padding: 40px 36px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(20, 30, 60, .08);
  }
  .logo {
    font-size: 20px;
    font-weight: 700;
    color: #4f46e5;
    margin-bottom: 6px;
    letter-spacing: -.02em;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .sub {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 28px;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    color: #374151;
  }
  input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
    outline: none;
  }
  input:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, .12);
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s;
  }
  button:hover { background: #4338ca; }
  button:disabled { background: #a5b4fc; cursor: not-allowed; }
  .error {
    background: #fef2f2;
    color: #b91c1c;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 16px;
    display: none;
  }
  .error.show { display: block; }
  .hint {
    text-align: center;
    font-size: 12px;
    color: #9ca3af;
    margin-top: 24px;
  }
  .hint code {
    background: #f3f4f6;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11.5px;
  }
</style>
</head>
<body>

  <div class="container">
    <div class="logo">ACME Corp</div>
    <h1>Connexion</h1>
    <p class="sub">Accédez à votre espace client</p>

    <form id="loginForm">
      <div class="field">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" id="submitBtn">Se connecter</button>
      <div class="error" id="error"></div>
    </form>

    <div class="hint">
      Comptes de test : <code>alice / alice123</code> &nbsp;·&nbsp; <code>admin / admin123</code>
    </div>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('error');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Connexion...';

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const d = await r.json();
      if (d.ok) {
        window.location.href = d.redirect;
      } else {
        errorBox.textContent = d.error || 'Erreur';
        errorBox.classList.add('show');
      }
    } catch (err) {
      errorBox.textContent = 'Erreur réseau';
      errorBox.classList.add('show');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Se connecter';
    }
  });
</script>
</body>
</html>
